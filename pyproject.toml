[project]
name = "prefect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "John Heberty de Freitas", email = "46422955+JohnHeberty@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.150.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
prefect = "server:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
